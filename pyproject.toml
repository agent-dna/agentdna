[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dna"
version = "0.4.1"
description = "Security, Governance and Audit framework for AI Agents"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"

authors = [
  { name = "Aparna Ullas"},
  { name = "Arnab Ghose"},
]

dependencies = [
  "requests>=2.0.0",
  "python-dotenv>=1.0.0",
  "rubix-py>=1.0.0",
  "py-multiformats-cid>=0.4.4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Required for the three-tier semantic CBAC pipeline
# Install with: pip install agent-dna[semantic]
semantic = [
  "sentence-transformers>=3.0.0",
  "scipy>=1.10.0",
  "numpy>=1.24.0",
  # HHEM-2.1's remote code (hallucination_score) is incompatible with transformers 5.x
  "transformers>=4.40.0,<5",
]
# Required to run the reference CBAC decision service (agentdna/cbac_service.py)
# Install with: pip install agent-dna[semantic,service]
service = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]
# Required for the MCP integration glue (agentdna/mcp.py)
# Install with: pip install agent-dna[mcp]
mcp = [
  "fastmcp>=3.4.0",
  "langchain-mcp-adapters>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/agent-dna/agentdna"
Repository = "https://github.com/agent-dna/agentdna"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.0.0",
    "ruff>=0.15.20",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pyright]
# Package is only partially typed; basic keeps the hook signal useful without noise.
typeCheckingMode = "basic"
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
include = ["agentdna"]
# examples/ has its own heavy deps that aren't in the dev env; ruff still covers it, pyright does not.
exclude = ["examples", ".venv", "**/__pycache__"]
