[project]
name = "google-sheets-mcp-agent"
version = "0.1.0"
description = "Streamlit + MCP Google Sheets task agent, signed via AgentDNA"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.36",
    "pandas>=2.0",
    "python-dotenv",
    "mcp>=1.0",
    "google-api-python-client",
    "google-auth",
    "agent-dna",
]

[tool.uv.sources]
agent-dna = { path = "../../", editable = true }
