services:
  kong:
    image: kong:3.9.1
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PLUGINS: bundled,agentdna-gate,env-key
      KONG_LUA_PACKAGE_PATH: /kong/?.lua;;
      KONG_NGINX_HTTP_CLIENT_BODY_BUFFER_SIZE: 10m  # keep bodies in memory, so the plugins can read them
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: "off"
      STRIPE_AUTH: ${STRIPE_AUTH}                   # the apps' keys: only Kong has them
      JIRA_AUTH: ${JIRA_AUTH}
    volumes:
      - ./kong.yml:/kong/kong.yml:ro
      - ./agentdna-gate:/kong/kong/plugins/agentdna-gate:ro
      - ./env-key:/kong/kong/plugins/env-key:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach the gate service on Linux too
    ports:
      - "127.0.0.1:8880:8000"
